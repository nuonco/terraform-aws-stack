<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1040" height="660" fill="#f8fafc" rx="8"/>

  <!-- external column (left) -->
  <rect x="20" y="80" width="310" height="150" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="175" y="106" text-anchor="middle" fill="#0c4a6e" font-weight="600" font-size="14">Nuon control plane</text>
  <text x="175" y="128" text-anchor="middle" fill="#075985" font-size="12">runner API (runner_api_url)</text>
  <text x="175" y="150" text-anchor="middle" fill="#075985" font-size="12">auth · settings · job polling</text>
  <text x="175" y="168" text-anchor="middle" fill="#075985" font-size="12">heartbeats · logs · state backend</text>
  <text x="175" y="196" text-anchor="middle" fill="#0c4a6e" font-size="12" font-weight="600">never connects inbound</text>

  <rect x="20" y="260" width="310" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="175" y="286" text-anchor="middle" fill="#0f172a" font-weight="600">Artifact &amp; source hosts</text>
  <text x="175" y="310" text-anchor="middle" fill="#334155" font-size="12">container registries (ECR, …)</text>
  <text x="175" y="330" text-anchor="middle" fill="#334155" font-size="12">raw.githubusercontent.com · git remotes</text>
  <text x="175" y="350" text-anchor="middle" fill="#334155" font-size="12">releases.hashicorp.com · helm repos</text>

  <rect x="20" y="410" width="310" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="175" y="438" text-anchor="middle" fill="#0f172a" font-weight="600">Customer OTLP endpoint (optional)</text>
  <text x="175" y="460" text-anchor="middle" fill="#334155" font-size="12">runner audit-log / telemetry export</text>

  <!-- Internet -->
  <rect x="370" y="20" width="640" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="690" y="45" text-anchor="middle" fill="#0f172a" font-weight="600">Internet</text>

  <!-- AWS account / region -->
  <rect x="360" y="80" width="660" height="560" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="376" y="104" fill="#334155" font-weight="600">Customer AWS account · var.aws_region</text>

  <!-- VPC -->
  <rect x="376" y="118" width="628" height="416" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="392" y="142" fill="#0f172a" font-weight="600">VPC 10.128.0.0/16</text>

  <!-- IGW -->
  <rect x="620" y="128" width="140" height="34" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="690" y="150" text-anchor="middle" fill="#78350f" font-weight="600">Internet Gateway</text>

  <!-- AZ columns -->
  <rect x="392" y="176" width="292" height="344" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="406" y="196" fill="#64748b">Availability Zone A</text>
  <rect x="696" y="176" width="292" height="230" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="710" y="196" fill="#64748b">Availability Zone B</text>

  <!-- public subnets -->
  <rect x="406" y="206" width="264" height="86" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="420" y="228" fill="#14532d" font-weight="600">Public subnet 10.128.0.0/24</text>
  <rect x="420" y="240" width="150" height="40" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="495" y="258" text-anchor="middle" fill="#14532d" font-weight="600">NAT Gateway</text>
  <text x="495" y="273" text-anchor="middle" fill="#166534" font-size="11">+ Elastic IP</text>

  <rect x="710" y="206" width="264" height="86" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="724" y="228" fill="#14532d" font-weight="600">Public subnet 10.128.16.0/24</text>
  <text x="724" y="248" fill="#166534" font-size="11">(no NAT — single NAT gateway)</text>

  <!-- private subnets -->
  <rect x="406" y="306" width="264" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="420" y="328" fill="#1e3a8a" font-weight="600">Private subnet 10.128.1.0/24</text>
  <text x="420" y="348" fill="#1e40af" font-size="11">for workload infra (e.g. EKS)</text>

  <rect x="710" y="306" width="264" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="724" y="328" fill="#1e3a8a" font-weight="600">Private subnet 10.128.17.0/24</text>
  <text x="724" y="348" fill="#1e40af" font-size="11">for workload infra (e.g. EKS)</text>

  <!-- runner subnet -->
  <rect x="406" y="392" width="264" height="114" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="420" y="414" fill="#4c1d95" font-weight="600">Runner subnet 10.128.2.0/24</text>
  <rect x="420" y="424" width="236" height="70" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="538" y="444" text-anchor="middle" fill="#4c1d95" font-weight="600">Nuon runner (EC2, ASG ×1)</text>
  <text x="538" y="461" text-anchor="middle" fill="#5b21b6" font-size="11">Amazon Linux 2023 · t3.medium</text>
  <text x="538" y="476" text-anchor="middle" fill="#5b21b6" font-size="11">no public IP · IMDSv2 · SG: outbound-only</text>

  <!-- routes: runner -> NAT -> IGW -> internet (routed through the gap between AZ columns) -->
  <path d="M 645 424 C 681 412 681 402 681 385 L 681 272 L 576 272" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 576 254 L 692 254 L 692 166" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 690 128 L 690 62" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- regional services row -->
  <rect x="376" y="548" width="200" height="76" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="476" y="572" text-anchor="middle" fill="#7c2d12" font-weight="600">Secrets Manager</text>
  <text x="476" y="590" text-anchor="middle" fill="#9a3412" font-size="11">&lt;install-id&gt;-* secrets</text>
  <text x="476" y="605" text-anchor="middle" fill="#9a3412" font-size="11">telemetry-export-config</text>

  <rect x="590" y="548" width="200" height="76" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="690" y="572" text-anchor="middle" fill="#7c2d12" font-weight="600">CloudWatch Logs</text>
  <text x="690" y="592" text-anchor="middle" fill="#9a3412" font-size="11">/nuon/&lt;install-id&gt;/runner</text>

  <rect x="804" y="548" width="200" height="76" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="904" y="568" text-anchor="middle" fill="#7c2d12" font-weight="600">IAM roles</text>
  <text x="904" y="586" text-anchor="middle" fill="#9a3412" font-size="11">provision · maintenance · deprovision</text>
  <text x="904" y="601" text-anchor="middle" fill="#9a3412" font-size="11">break-glass · custom</text>
  <text x="904" y="616" text-anchor="middle" fill="#9a3412" font-size="11">assumed per-job by the runner</text>

  <!-- runner -> regional services -->
  <path d="M 476 506 L 476 548" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 560 494 C 640 515 675 530 688 546" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 625 494 C 730 525 835 535 896 546" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- egress-only arrows runner -> external (exit left, rise in the gutter) -->
  <path d="M 420 452 C 388 452 306 438 302 234" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 420 462 C 388 462 350 430 336 348" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 420 472 C 390 472 360 465 336 455" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="524" fill="#0369a1" font-size="12" font-weight="600">outbound HTTPS only (poll for jobs)</text>
</svg>
